<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DDPM 的輸入擾動</title>
<meta name="description" content="圖解 Ning 等人的 ICML 2023 論文：DDPM 訓練與取樣時的網路輸入不一致（曝光偏差），以及在訓練時擾動網路輸入、保持目標不變的 DDPM-IP。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Noto+Serif+TC:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
/* Layout: editorial reading column (≤700px) beside a sticky contents rail; each
   interactive figure sits on a wider "plate". One accent colour; two figure-only
   series colours (parallel / perpendicular mode). */
:root{
  --bg:#F6F4EE;--surface:#FFFFFF;--surface-2:#EEEBE3;--ink:#1D1C19;--ink-2:#57534B;--ink-3:#67635A;
  --line:#DCD7CB;--accent:#B4532A;--accent-soft:#F3E2D8;--c-par:#3F6E8C;--c-perp:#6B7A3A;
  --shadow:0 4px 16px rgba(0,0,0,.15);
  --f-display:"Newsreader","Noto Serif TC","Songti TC","PMingLiU",Georgia,serif;
  --f-cjk:"Noto Serif TC","Songti TC","PMingLiU",Georgia,serif;
  --f-body:"IBM Plex Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,0,0,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#161513;--surface:#1F1E1B;--surface-2:#2A2925;--ink:#EEEBE4;--ink-2:#B5B0A5;--ink-3:#9C978C;
    --line:#36342F;--accent:#E58C66;--accent-soft:#3B2820;--c-par:#8DB4D3;--c-perp:#A9BC7C;
    --shadow:0 4px 16px rgba(0,0,0,.5);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161513;--surface:#1F1E1B;--surface-2:#2A2925;--ink:#EEEBE4;--ink-2:#B5B0A5;--ink-3:#9C978C;
  --line:#36342F;--accent:#E58C66;--accent-soft:#3B2820;--c-par:#8DB4D3;--c-perp:#A9BC7C;
  --shadow:0 4px 16px rgba(0,0,0,.5);color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.8 var(--f-body);padding-bottom:72px}
a{color:var(--accent);text-underline-offset:3px}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
code,.mono{font-family:var(--f-mono);font-size:.88em}

/* app bar */
.appbar{position:sticky;top:0;z-index:50;height:64px;background:color-mix(in oklab,var(--bg) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:box-shadow 160ms var(--ease)}
.appbar.raised{box-shadow:0 1px 0 var(--line)}
.appbar-in{max-width:1240px;margin:0 auto;height:64px;padding:0 24px;display:flex;align-items:center;gap:16px}
.appbar .no{font:500 13px/1 var(--f-mono);color:var(--ink-3);white-space:nowrap}
.appbar .ttl{font:600 15px/1.3 var(--f-cjk);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:background 160ms var(--ease)}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:20px;height:20px}

/* shell */
.shell{max-width:1240px;margin:0 auto;padding:0 24px;display:grid;grid-template-columns:minmax(0,1fr);gap:48px}
@media (min-width:1024px){.shell{grid-template-columns:200px minmax(0,1fr)}}
.toc{display:none}
@media (min-width:1024px){
  .toc{display:block;position:sticky;top:88px;align-self:start;max-height:calc(100vh - 110px);overflow:auto;padding:8px 0}
  .toc ol{list-style:none;margin:0;padding:0}
  .toc a{display:grid;grid-template-columns:28px 1fr;gap:6px;padding:7px 10px;border-radius:10px;color:var(--ink-2);text-decoration:none;font-size:13px;line-height:1.45;transition:background 160ms var(--ease),color 160ms var(--ease)}
  .toc a:hover{background:var(--surface-2);color:var(--ink)}
  .toc a .n{font:500 12px/1.6 var(--f-mono);color:var(--ink-3)}
  .toc a.on{background:var(--accent-soft);color:var(--ink)}
  .toc a.on .n{color:var(--accent)}
}
.tocbar{position:sticky;top:64px;z-index:40;background:var(--bg);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.tocbar::-webkit-scrollbar{display:none}
.tocbar a{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;font:500 13px/1 var(--f-body);color:var(--ink-2);text-decoration:none}
.tocbar a.on{color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
@media (min-width:1024px){.tocbar{display:none}}
main{min-width:0}

/* prose */
.prose{max-width:700px}
.prose p{margin:0 0 1.1em}
.prose ul,.prose ol{margin:0 0 1.2em;padding-left:1.3em}
.prose li{margin:.3em 0}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:-.005em;margin:0}
h2{font-family:var(--f-cjk);font-size:32px;line-height:1.3;margin:0 0 20px;max-width:700px}
h3{font-family:var(--f-cjk);font-size:20px;line-height:1.45;margin:40px 0 12px}
section.ch{padding:96px 0 24px;border-top:1px solid var(--line);scroll-margin-top:72px}
section.ch:first-of-type{border-top:0}
.ch-num{font:500 13px/1 var(--f-mono);color:var(--accent);letter-spacing:.06em;margin-bottom:14px}
.tag{display:inline-block;font:500 12px/1 var(--f-body);color:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:4px 8px;margin:0 4px;vertical-align:2px;white-space:nowrap}
.note{font-size:15px;color:var(--ink-2)}
.eq{display:flex;align-items:center;gap:12px;margin:8px 0 22px;max-width:700px}
.eq-m{flex:1;min-width:0;overflow-x:auto;overflow-y:hidden}
.eq-n{font:500 12px/1 var(--f-mono);color:var(--ink-3);white-space:nowrap}
.katex-display{margin:.4em 0;overflow-x:auto;overflow-y:hidden;padding:4px 0}
.katex{font-size:1.06em}
.read{font-size:15px;color:var(--ink-2);margin:20px 0 0}
.read a{font-weight:500}
.callout{max-width:760px;margin:24px 0 28px;padding:22px 24px;border:1px solid color-mix(in oklab,var(--accent) 55%,var(--line));border-radius:16px;background:var(--accent-soft)}
.callout .ct{margin:0 0 14px;font:600 17px/1.45 var(--f-cjk)}
.callout .cv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:0 0 14px}
.callout .cv>div{background:var(--surface);border-radius:10px;padding:12px 14px}
.callout .num{display:block;font:500 28px/1.1 var(--f-mono);color:var(--accent);margin-bottom:6px}
.callout .cl{font-size:13px;line-height:1.5;color:var(--ink-2)}
.callout>p:last-child{margin:0;font-size:15px;line-height:1.75}
.pair{display:grid;grid-template-columns:1fr;gap:16px;max-width:700px;margin:8px 0 24px}
@media (min-width:640px){.pair{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px}
.card h3{margin:0 0 6px;font:600 16px/1.4 var(--f-cjk)}
.card p{margin:0;font-size:15px;color:var(--ink-2)}
.card .k{font:500 12px/1 var(--f-mono);color:var(--ink-3);margin-bottom:10px;display:block}
.card .k{display:flex;align-items:center;gap:8px}.card .k::before{content:"";width:22px;border-top:2px solid var(--c-par)}.card.perp .k::before{border-top:2px dashed var(--c-perp)}

/* tables */
.tscroll{overflow-x:auto;max-width:100%;margin:8px 0 24px;padding:4px;border:1px solid var(--line);border-radius:16px;background:var(--surface);
  background-image:linear-gradient(to right,var(--surface),var(--surface)),linear-gradient(to left,var(--surface),var(--surface)),linear-gradient(to right,rgba(0,0,0,.08),transparent),linear-gradient(to left,rgba(0,0,0,.08),transparent);
  background-position:left,right,left,right;background-repeat:no-repeat;background-size:24px 100%,24px 100%,12px 100%,12px 100%;background-attachment:local,local,scroll,scroll}
table{border-collapse:collapse;width:100%;font-size:15px;line-height:1.5}
caption{caption-side:top;text-align:left;padding:14px 16px 4px;font:500 13px/1.4 var(--f-body);color:var(--ink-3)}
th,td{padding:10px 16px;text-align:left;border-top:1px solid var(--line);vertical-align:top}
thead th{border-top:0;font-weight:600;color:var(--ink-2);font-size:13px}
td.num,th.num{font-family:var(--f-mono);font-size:14px;text-align:right;white-space:nowrap}
tr.hl td{background:var(--accent-soft)}
.prose .tscroll{max-width:700px}
@media (max-width:479px){
  table.stack thead{display:none}
  table.stack tr{display:block;border-top:1px solid var(--line);padding:10px 16px}
  table.stack td{display:grid;grid-template-columns:7.5em 1fr;gap:8px;border:0;padding:3px 0}
  table.stack td::before{content:attr(data-h);color:var(--ink-3);font-size:13px}
  table.stack td:first-child{font-weight:600;display:block}
  table.stack td:first-child::before{content:none}
}

/* checks */
details.check{max-width:700px;margin:28px 0 0;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
details.check>summary{cursor:pointer;list-style:none;padding:14px 20px;min-height:44px;font:500 15px/1.4 var(--f-body);display:flex;align-items:center;gap:10px}
details.check>summary::-webkit-details-marker{display:none}
details.check>summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(-45deg);transition:transform 160ms var(--ease)}
details.check[open]>summary::before{transform:rotate(45deg)}
details.check .qa{padding:0 20px 18px;font-size:15px}
details.check .q{font-weight:600;margin:12px 0 4px}
details.check .a{color:var(--ink-2);margin:0;padding-left:12px;border-left:2px solid var(--accent-soft)}

/* hero */
.hero{padding:72px 0 40px}
.eyebrow{font:500 13px/1.6 var(--f-mono);color:var(--ink-3);letter-spacing:.04em;margin-bottom:24px}
.eyebrow b{color:var(--accent);font-weight:500}
.hero h1{font-family:var(--f-cjk);font-weight:700;font-size:clamp(32px,6.2vw,64px);line-height:1.18;letter-spacing:-.01em;max-width:15em}
.hero h1 .lat{font-family:var(--f-display);font-weight:600}
.dek{font-size:20px;line-height:1.65;color:var(--ink-2);max-width:640px;margin:24px 0 8px}
.byline{font-size:15px;color:var(--ink-3);margin:0 0 40px}
.facts{display:grid;grid-template-columns:1fr;gap:16px;margin:40px 0 28px}
@media (min-width:768px){.facts{grid-template-columns:repeat(3,1fr)}}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 22px 24px}
.fact .n{font:500 12px/1 var(--f-mono);color:var(--accent);display:block;margin-bottom:12px}
.fact p{margin:0;font-size:15px;line-height:1.75}
.links{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 15px/1 var(--f-body);text-decoration:none;cursor:pointer;transition:background 160ms var(--ease),border-color 160ms var(--ease)}
.btn:hover{background:var(--surface-2)}
.btn.fill{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.fill{color:#1C0F0A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.fill{color:#1C0F0A}}
.btn.fill:hover{background:color-mix(in oklab,var(--accent) 88%,#000)}

/* k axis (HTML so labels keep their size) */
.kaxis{position:relative;margin:8px 0 0;padding:0 8px}
.kx-track{position:relative;height:56px}
.kx-line{position:absolute;left:0;right:0;bottom:30px;height:2px;background:var(--ink)}
.kx-tick{position:absolute;bottom:0;transform:translateX(-50%);text-align:center;font:500 13px/1.2 var(--f-mono);color:var(--ink-2);white-space:nowrap}
.kx-tick::before{content:"";position:absolute;left:50%;bottom:24px;width:2px;height:12px;background:var(--ink);transform:translateX(-50%)}
.kx-tick b{font-family:var(--f-display);font-style:italic;font-size:17px;color:var(--ink);font-weight:600}
.kx-tick.l{transform:none;text-align:left}.kx-tick.l::before{left:0;transform:none}
.kx-tick.r{transform:translateX(-100%);text-align:right}.kx-tick.r::before{left:auto;right:0;transform:none}
.kx-mark{position:absolute;bottom:31px;width:0}
.kx-dot{position:absolute;left:-6px;bottom:-6px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--ink-2)}
.kx-mark.acc .kx-dot{background:var(--accent);border-color:var(--accent)}
.kx-stem{position:absolute;left:-.5px;bottom:6px;width:1px;background:var(--ink-3)}
.kx-lab{position:absolute;z-index:2;white-space:nowrap;font:500 13px/1.3 var(--f-body);color:var(--ink);background:var(--bg);padding:2px 6px;border-radius:6px}
.plate .kx-lab{background:var(--surface)}
.kx-lab .v{font-family:var(--f-mono);color:var(--accent)}
.kx-lab.c{transform:translateX(-50%)}.kx-lab.r{transform:translateX(calc(-100% + 8px))}.kx-lab.l{transform:translateX(-8px)}

/* plates */
.plate{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;margin:32px 0 8px;max-width:960px;transition:border-color 240ms var(--ease),box-shadow 240ms var(--ease)}
.plate:focus-within{border-color:color-mix(in oklab,var(--accent) 45%,var(--line));box-shadow:0 0 0 4px var(--accent-soft)}
.plate-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:6px}
.plate-h .id{font:500 12px/1 var(--f-mono);color:var(--accent);letter-spacing:.06em}
.plate-h h3{margin:0;font:600 18px/1.4 var(--f-cjk)}
.plate-lead{font-size:15px;color:var(--ink-2);margin:0 0 18px;max-width:720px}
.pg{display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
@media (min-width:768px){.pg.two{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}.pg.side{grid-template-columns:minmax(0,1fr) 260px}}
.fig{min-width:0;width:100%}
.fig svg{display:block;max-width:100%;height:auto;overflow:visible}
.plate-f{margin:18px 0 0;padding-top:14px;border-top:1px solid var(--line);font-size:13px;line-height:1.6;color:var(--ink-3)}
.ctl{display:flex;flex-direction:column;gap:14px;min-width:0}
.ctl-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.lbl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font:500 13px/1.4 var(--f-body);color:var(--ink-2)}
.lbl output{font:500 14px/1 var(--f-mono);color:var(--ink)}
.rng{display:flex;flex-direction:column;gap:2px;min-height:44px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:32px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:999px;background:var(--line)}
input[type=range]::-moz-range-track{height:4px;border-radius:999px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);margin-top:-8px;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--accent);transition:transform 160ms var(--ease)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--accent)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.15)}
input[type=range]:focus-visible{outline:none}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px var(--accent-soft),0 0 0 5px var(--accent)}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.seg button{min-height:38px;min-width:44px;padding:0 12px;border:0;border-radius:9px;background:transparent;color:var(--ink-2);font:500 13px/1.2 var(--f-body);cursor:pointer;transition:background 160ms var(--ease),color 160ms var(--ease)}
.seg button:hover{background:var(--surface-2)}
.seg button[aria-pressed=true]{background:var(--accent-soft);color:var(--ink)}
.chip{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font:500 13px/1 var(--f-body);cursor:pointer;transition:background 160ms var(--ease)}
.chip:hover{background:var(--surface-2)}
.chip[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.small-btn{min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 13px/1 var(--f-body);cursor:pointer;transition:background 160ms var(--ease)}
.small-btn:hover{background:var(--surface-2)}
.small-btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .small-btn.pri{color:#1C0F0A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .small-btn.pri{color:#1C0F0A}}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px;color:var(--ink-2);cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.readout{font:400 13px/1.7 var(--f-mono);color:var(--ink-2);background:var(--surface-2);border-radius:10px;padding:10px 14px;margin:0}
.readout b{color:var(--ink);font-weight:500}
.readout .acc{color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-2);margin:10px 0 0}
.lg{display:inline-flex;align-items:center;gap:8px}
.lg::before{content:"";width:22px;height:0;border-top:2px solid var(--ink)}
.lg.par::before{border-top:2px solid var(--c-par)}
.lg.perp::before{border-top:2px dashed var(--c-perp)}
.lg.acc::before{border-top:3px solid var(--accent)}
.lg.tot::before{border-top:3px solid var(--ink)}
.lg.ref::before{border-top:2px dashed var(--ink-3)}
.lg.npar::before{border-top:2px dashed var(--c-par);border-top-style:dashed}
.lg.dot::before{border-top:2px dotted var(--c-perp)}
.lg.pt::before{width:10px;height:10px;border:2px solid var(--ink);border-radius:50%}
.steps{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.steps button{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 12px 0 6px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font:500 13px/1.2 var(--f-body);cursor:pointer;transition:background 160ms var(--ease)}
.steps button .s{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font:500 12px/1 var(--f-mono)}
.steps button[aria-pressed=true]{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
.steps button[aria-pressed=true] .s{background:var(--accent);color:var(--surface)}
.cap{font-size:14px;color:var(--ink-2);margin:12px 0 0;line-height:1.65}
.hide{display:none!important}

/* svg */
svg text{font-family:var(--f-body)}
svg .tk{font:400 12px var(--f-mono);fill:var(--ink-3)}
svg .al{font:500 13px var(--f-body);fill:var(--ink-2)}
svg .lab{font:500 13px var(--f-body);fill:var(--ink)}
svg .labm{font:500 13px var(--f-mono);fill:var(--ink)}
svg .grid{stroke:var(--line);stroke-width:1}
svg .axl{stroke:var(--ink-3);stroke-width:1}
svg .manifold{stroke:var(--ink);stroke-width:2.5}
svg .faint{stroke:var(--line);stroke-width:1}
svg .pt{fill:var(--ink-3);opacity:.45}
svg .par{stroke:var(--c-par);stroke-width:2.5;fill:none}
svg .par-f{fill:var(--c-par)}
svg .perp{stroke:var(--c-perp);stroke-width:2.5;fill:none}
svg .perp-f{fill:var(--c-perp)}
svg .acc{stroke:var(--accent);stroke-width:3;fill:none}
svg .acc-f{fill:var(--accent)}
svg .ink{stroke:var(--ink);stroke-width:2;fill:none}
svg .ink-f{fill:var(--ink)}
svg .tot{stroke:var(--ink);stroke-width:3;fill:none}
svg .ref{stroke:var(--ink-3);stroke-width:1.5;fill:none;stroke-dasharray:5 4}
svg .dash{stroke-dasharray:6 5}
svg .dot{stroke-dasharray:1.5 4;stroke-linecap:round}
svg .proj{stroke:var(--ink-3);stroke-width:1.2;stroke-dasharray:3 3;fill:none}
svg .fillp{fill:var(--c-perp);opacity:.16}
svg .filla{fill:var(--accent);opacity:.18}
svg .cur{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:2 3}
svg .hollow{fill:var(--surface);stroke:var(--ink);stroke-width:2}
svg .kdot{fill:var(--accent)}

/* algorithm grid */
.algo{padding:4px;max-width:860px;border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden;margin:16px 0 24px}
.algo .row{display:grid;grid-template-columns:1fr;border-top:1px solid var(--line)}
.algo .row:first-child{border-top:0}
.algo .row.hd{background:var(--surface-2);font:500 12px/1 var(--f-mono);color:var(--ink-3)}
.algo .row.hd>div{padding:10px 16px}
.algo .row>code{display:block;padding:10px 16px 2px;font:400 13px/1.6 var(--f-mono);color:var(--ink);white-space:pre-wrap;word-break:break-word}
.algo .ex{padding:0 16px 10px;font-size:14px;line-height:1.6;color:var(--ink-2)}
.algo .row.hd .ex-h{display:none}
@media (min-width:768px){
  .algo .row{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
  .algo .row>code{padding:10px 16px;border-right:1px solid var(--line)}
  .algo .ex{padding:10px 16px}
  .algo .row.hd .ex-h{display:block}
}

/* timeline */
.tl-ctl{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 16px}
.tl-chips{display:flex;flex-wrap:wrap;gap:8px}
.tl-nav{display:flex;gap:8px}
.rail{overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 16px;scrollbar-width:thin}
.rail-track{display:flex;gap:14px;width:max-content}
.ev{scroll-snap-align:start;width:260px;flex:none;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:8px;transition:opacity 240ms var(--ease)}
.ev.me{border:2px solid var(--accent)}
.ev.dim{opacity:.35}
.ev .yr{font:500 13px/1 var(--f-mono);color:var(--ink-3)}
.ev .grp{align-self:flex-start;font:500 12px/1 var(--f-body);padding:5px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-2)}
.ev.me .grp{background:var(--accent);color:var(--surface)}
.ev h3{margin:0;font:600 15px/1.45 var(--f-body)}
.ev .who{font-size:13px;color:var(--ink-3)}
.ev p{margin:0;font-size:14px;line-height:1.6;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ev .lk{margin-top:auto;display:flex;gap:14px;font-size:13px;font-weight:500}
.ev .lk a{min-height:32px;display:inline-flex;align-items:center}

/* reading list, footer */
.rl{list-style:none;padding:0;margin:0;max-width:700px;counter-reset:rl}
.rl li{display:grid;grid-template-columns:36px 1fr;gap:8px;padding:12px 0;border-top:1px solid var(--line);counter-increment:rl}
.rl li::before{content:counter(rl,decimal-leading-zero);font:500 13px/1.9 var(--f-mono);color:var(--ink-3)}
.rl a{font-weight:500}
.rl span{display:block;font-size:14px;color:var(--ink-3)}
footer{max-width:1240px;margin:80px auto 0;padding:32px 24px;border-top:1px solid var(--line);font-size:14px;color:var(--ink-3)}
footer p{max-width:700px;margin:0 0 8px}
#pm-bar{position:fixed;left:16px;bottom:16px;z-index:9999;display:flex;gap:8px;font:500 13px/1 'IBM Plex Sans','Noto Sans TC',system-ui,sans-serif}
#pm-bar a{padding:10px 14px;border-radius:999px;min-height:20px;display:inline-flex;align-items:center;text-decoration:none;box-shadow:var(--shadow)}
#pm-bar a:first-child{background:var(--ink);color:var(--bg)}
#pm-bar a:last-child{background:var(--bg);color:var(--ink);border:1px solid var(--line)}

@media (max-width:599px){
  .eq{flex-direction:column;align-items:stretch;gap:0}
  .eq-n{align-self:flex-end;order:-1}
  .eq .katex-display>.katex{font-size:.9em}
}
@media (max-width:767px){
  body{font-size:16px}
  .shell{padding:0 16px}
  .appbar-in{padding:0 16px}
  section.ch{padding:64px 0 16px}
  h2{font-size:26px}
  .plate{padding:18px 16px;margin-left:-4px;margin-right:-4px}
  .dek{font-size:18px}
  footer{padding:32px 16px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{transition:none!important;animation:none!important}
}
