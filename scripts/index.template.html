<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Master</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
:root{
  --bg:#f6f5f1; --surface:#ffffff; --ink:#1f1e1c; --muted:#6b6862; --line:#e4e1da;
  --edge:#c9c5bc; --accent:#c96442; --accent-soft:#f3e3dc; --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#191917; --surface:#232320; --ink:#ecebe7; --muted:#a19e96; --line:#34332f;
    --edge:#4a4842; --accent:#e08a6b; --accent-soft:#3a2a23; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#191917; --surface:#232320; --ink:#ecebe7; --muted:#a19e96; --line:#34332f;
  --edge:#4a4842; --accent:#e08a6b; --accent-soft:#3a2a23; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 Inter,"Noto Sans TC",system-ui,sans-serif;display:grid;grid-template-columns:300px 1fr 360px;grid-template-rows:56px 1fr;height:100vh;overflow:hidden}
header{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--surface)}
header h1{font-size:16px;font-weight:600;margin:0;letter-spacing:-.01em}
header .stat{color:var(--muted);font-size:13px}
header nav{margin-left:auto;display:flex;gap:4px}
header nav a,header nav button{color:var(--ink);text-decoration:none;font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:none;cursor:pointer}
header nav a:hover,header nav button:hover{background:var(--accent-soft)}
aside{overflow:auto;padding:16px;background:var(--surface)}
#left{border-right:1px solid var(--line)}
#right{border-left:1px solid var(--line)}
.label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px}
.label:first-child{margin-top:0}
input[type=search],select{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
input[type=search]:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer;font-family:inherit;transition:background .15s,opacity .15s}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip[aria-pressed=false]{opacity:.4}
.chip:hover{background:var(--accent-soft)}
#results{list-style:none;margin:0;padding:0}
#results li{padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;line-height:1.35;display:flex;gap:8px}
#results li:hover,#results li.active{background:var(--accent-soft)}
#results .dot{flex:none;width:8px;height:8px;border-radius:50%;margin-top:5px}
main{position:relative;overflow:hidden}
svg{width:100%;height:100%;display:block;cursor:grab}
svg:active{cursor:grabbing}
.link{stroke:var(--edge);stroke-opacity:.55}
.node circle{stroke:var(--surface);stroke-width:1.5;cursor:pointer;transition:opacity .2s}
.node text{font-size:10px;fill:var(--muted);pointer-events:none;opacity:0;transition:opacity .2s}
.dim .node circle{opacity:.12}
.dim .link{stroke-opacity:.05}
.dim .node.hl circle{opacity:1}
.dim .node.hl text{opacity:1}
.dim .link.hl{stroke:var(--accent);stroke-opacity:.8}
.node.lbl text{opacity:1}
.node.sel circle{stroke:var(--ink);stroke-width:2.5}
.node.sel text{opacity:1;fill:var(--ink);font-weight:600}
.legend{position:absolute;left:16px;bottom:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);font-size:12px;color:var(--muted);max-width:280px}
.empty{color:var(--muted);padding:24px 0;line-height:1.7}
#detail h2{font-size:18px;line-height:1.35;margin:0 0 8px;letter-spacing:-.01em}
#detail .meta{color:var(--muted);font-size:13px;margin-bottom:12px}
#detail .badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:999px;background:var(--accent-soft)}
#detail p{margin:12px 0}
#detail a.open{display:inline-block;margin-top:4px;color:var(--accent);font-weight:500;text-decoration:none}
#detail a.open:hover{text-decoration:underline}
#detail ul{list-style:none;padding:0;margin:0}
#detail ul li{padding:7px 0;border-top:1px solid var(--line);font-size:13px;cursor:pointer;line-height:1.35}
#detail ul li:hover{color:var(--accent)}
.tag{font-size:11px;padding:2px 8px;border-radius:6px;border:1px solid var(--line);color:var(--muted);display:inline-block;margin:0 4px 4px 0}
.tut a{color:var(--accent);text-decoration:none}
@media (max-width:900px){
  body{grid-template-columns:1fr;grid-template-rows:56px auto 60vh auto;overflow:auto;height:auto}
  #left,#right{border:0;border-bottom:1px solid var(--line)}
  header .stat{display:none}
}
</style>
</head>
<body>
<header>
  <h1>Paper Master</h1>
  <span class="stat" id="stat"></span>
  <nav>
    <a href="papers.csv" download>下載 CSV</a>
    <a href="tutorials/index.html">互動教學</a>
    <button id="theme" type="button" aria-label="切換深淺色">◐</button>
  </nav>
</header>

<aside id="left">
  <div class="label">搜尋</div>
  <input type="search" id="q" placeholder="標題、作者或 tag…" autocomplete="off">
  <div class="label">來源分支</div>
  <div class="chips" id="branches"></div>
  <div class="label">研究群集</div>
  <div class="chips" id="clusters"></div>
  <div class="label">Tag</div>
  <select id="tag"><option value="">全部 tag</option></select>
  <div class="label" id="rcount">論文</div>
  <ul id="results"></ul>
</aside>

<main>
  <svg id="graph" role="img" aria-label="論文關聯圖"></svg>
  <div class="legend">節點大小＝被其他論文列為相關的次數；顏色＝研究群集；連線＝主題相似。拖曳平移；滾輪縮放會拉開節點間距、節點與文字大小不變，放大後顯示標題；點節點看詳情。</div>
</main>

<aside id="right"><div id="detail"><div class="empty">點選圖上的論文節點，或從左側清單選一篇，這裡會顯示完整資訊與最相關的論文。</div></div></aside>

<script>
const DATA = __DATA__;
const TUTORIALS = __TUTORIALS__;
const byId = new Map(DATA.map(d => [d.id, d]));
const clusters = [...new Set(DATA.map(d => d.cluster))];
const palette = ['#c96442','#3b7ea1','#6a9a4b','#9b5fb0','#d19a2a','#3f9c8f','#b5527a','#5b6bbf','#8a7a5c','#d4553b'];
const color = c => palette[clusters.indexOf(c) % palette.length];
const branches = [...new Set(DATA.flatMap(d => d.branch))];
const state = { q:'', clusters:new Set(clusters), branches:new Set(branches), tag:'', sel:null };

// theme toggle (per-viewer convenience only)
const root = document.documentElement;
try { const t = localStorage.getItem('pm-theme'); if (t) root.dataset.theme = t; } catch {}
document.getElementById('theme').onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('pm-theme', root.dataset.theme); } catch {}
};

function chip(container, label, dotColor, set, value){
  const b = document.createElement('button');
  b.className = 'chip'; b.type = 'button'; b.setAttribute('aria-pressed','true');
  b.innerHTML = (dotColor ? `<span class="dot" style="background:${dotColor}"></span>` : '') + label;
  b.onclick = () => { set.has(value) ? set.delete(value) : set.add(value); b.setAttribute('aria-pressed', set.has(value)); update(); };
  container.appendChild(b);
}
branches.forEach(b => chip(document.getElementById('branches'), b, null, state.branches, b));
clusters.forEach(c => chip(document.getElementById('clusters'), `${c} <span style="opacity:.6">${DATA.filter(d=>d.cluster===c).length}</span>`, color(c), state.clusters, c));
const tagSel = document.getElementById('tag');
const tagCount = {}; DATA.forEach(d => d.tags.forEach(t => tagCount[t] = (tagCount[t]||0)+1));
Object.entries(tagCount).sort((a,b)=>b[1]-a[1]).forEach(([t,n]) => tagSel.add(new Option(`${t} (${n})`, t)));
tagSel.onchange = () => { state.tag = tagSel.value; update(); };
document.getElementById('q').oninput = e => { state.q = e.target.value.trim().toLowerCase(); update(); };

// graph
const svg = d3.select('#graph');
const g = svg.append('g');
// semantic zoom: the transform moves node positions apart; circles and labels keep their screen size
let T = d3.zoomIdentity, K0 = 1; // K0 = scale of the fitted overview
const zoom = d3.zoom().scaleExtent([.2, 12]).on('zoom', e => { T = e.transform; draw(); });
svg.call(zoom);
const links = [];
const seen = new Set();
DATA.forEach(d => d.related.forEach(r => { const k = [Math.min(d.id,r),Math.max(d.id,r)].join('-'); if (!seen.has(k)) { seen.add(k); links.push({source:d.id, target:r}); } }));
const linkSel = g.append('g').selectAll('line').data(links).join('line').attr('class','link');
const nodeSel = g.append('g').selectAll('g').data(DATA, d => d.id).join('g').attr('class','node');
const radius = d => 4 + Math.sqrt(d.degree) * 2.6;
nodeSel.append('circle').attr('r', radius).attr('fill', d => color(d.cluster))
  .on('click', (e, d) => select(d.id))
  .append('title').text(d => d.title);
nodeSel.append('text').attr('dy', d => -radius(d) - 3).attr('text-anchor','middle').text(d => d.title.length > 48 ? d.title.slice(0,46) + '…' : d.title);
nodeSel.call(d3.drag()
  .subject((e,d) => ({x: T.applyX(d.x), y: T.applyY(d.y)}))
  .on('start', (e,d) => { if (!e.active) sim.alphaTarget(.2).restart(); d.fx = d.x; d.fy = d.y; })
  .on('drag', (e,d) => { d.fx = T.invertX(e.x); d.fy = T.invertY(e.y); })
  .on('end', (e,d) => { if (!e.active) sim.alphaTarget(0); d.fx = d.fy = null; }));

const center = c => { const a = clusters.indexOf(c) / clusters.length * Math.PI * 2; return [Math.cos(a) * 340, Math.sin(a) * 340]; };
const sim = d3.forceSimulation(DATA)
  .force('link', d3.forceLink(links).id(d => d.id).distance(50).strength(.25))
  .force('charge', d3.forceManyBody().strength(-38))
  .force('x', d3.forceX(d => center(d.cluster)[0]).strength(.07))
  .force('y', d3.forceY(d => center(d.cluster)[1]).strength(.07))
  .force('collide', d3.forceCollide(d => radius(d) + 2))
  .stop();
sim.tick(400); // settle layout up front so the first paint and the fit are stable
function draw(){
  linkSel.attr('x1', d => T.applyX(d.source.x)).attr('y1', d => T.applyY(d.source.y)).attr('x2', d => T.applyX(d.target.x)).attr('y2', d => T.applyY(d.target.y));
  nodeSel.attr('transform', d => `translate(${T.applyX(d.x)},${T.applyY(d.y)})`);
  // labels appear once nodes are spread far enough apart to read them
  const z = T.k / K0;
  nodeSel.classed('lbl', d => z >= 5 || (z >= 2.5 && d.degree >= 6));
}
sim.on('tick', draw);
draw();
function fit(){
  const {width, height} = svg.node().getBoundingClientRect();
  const xs = DATA.map(d => d.x), ys = DATA.map(d => d.y);
  const [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
  const k = K0 = Math.min(width / (x1 - x0 + 80), height / (y1 - y0 + 80), 2);
  svg.call(zoom.transform, d3.zoomIdentity.translate(width/2 - k*(x0+x1)/2, height/2 - k*(y0+y1)/2).scale(k));
}
fit();

function visible(d){
  if (!state.clusters.has(d.cluster)) return false;
  if (!d.branch.some(b => state.branches.has(b))) return false;
  if (state.tag && !d.tags.includes(state.tag)) return false;
  if (state.q && !(d.title + ' ' + d.authors.join(' ') + ' ' + d.tags.join(' ')).toLowerCase().includes(state.q)) return false;
  return true;
}
function update(){
  const vis = new Set(DATA.filter(visible).map(d => d.id));
  nodeSel.style('display', d => vis.has(d.id) ? null : 'none');
  linkSel.style('display', d => vis.has(d.source.id) && vis.has(d.target.id) ? null : 'none');
  const filtering = state.q || state.tag;
  const hl = new Set(filtering ? vis : []);
  if (state.sel) { hl.add(state.sel); byId.get(state.sel).related.forEach(r => hl.add(r)); }
  g.classed('dim', hl.size > 0);
  nodeSel.classed('hl', d => hl.has(d.id)).classed('sel', d => d.id === state.sel);
  linkSel.classed('hl', d => state.sel && (d.source.id === state.sel || d.target.id === state.sel));
  const list = DATA.filter(d => vis.has(d.id));
  document.getElementById('rcount').textContent = `論文 · ${list.length}`;
  document.getElementById('stat').textContent = `${DATA.length} 篇論文 · ${clusters.length} 個群集 · ${links.length} 條關聯`;
  const ul = document.getElementById('results'); ul.innerHTML = '';
  list.slice(0, 200).forEach(d => {
    const li = document.createElement('li'); if (d.id === state.sel) li.className = 'active';
    li.innerHTML = `<span class="dot" style="background:${color(d.cluster)}"></span><span>${esc(d.title)}</span>`;
    li.onclick = () => select(d.id); ul.appendChild(li);
  });
}
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function select(id){
  state.sel = id; update();
  const d = byId.get(id);
  const tuts = TUTORIALS.filter(t => t.papers.includes(id));
  document.getElementById('detail').innerHTML = `
    <span class="badge"><span class="dot" style="width:8px;height:8px;border-radius:50%;background:${color(d.cluster)}"></span>${esc(d.cluster)}</span>
    <h2 style="margin-top:12px">${esc(d.title)}</h2>
    <div class="meta">${d.authors.length ? esc(d.authors.slice(0,5).join(', ')) + (d.authors.length > 5 ? ' et al.' : '') : '作者未知'}${d.year ? ' · ' + d.year : ''}</div>
    <a class="open" href="${esc(d.url)}" target="_blank" rel="noopener">開啟論文 ↗</a>
    ${d.summary ? `<p>${esc(d.summary)}</p>` : ''}
    <div class="label">Tags</div>${d.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}
    <div class="label">來源</div><div style="font-size:13px">${d.sources.map(esc).join('<br>')}<br><span style="color:var(--muted)">原分類：${d.cats.map(esc).join('、')}</span></div>
    ${tuts.length ? `<div class="label">互動教學</div><div class="tut">${tuts.map(t => `<a href="tutorials/${t.file}">${esc(t.title)} →</a>`).join('<br>')}</div>` : ''}
    <div class="label">最相關的論文</div>
    <ul>${d.related.map(r => `<li data-id="${r}">${esc(byId.get(r).title)}</li>`).join('')}</ul>`;
  document.querySelectorAll('#detail li[data-id]').forEach(li => li.onclick = () => select(+li.dataset.id));
}
update();
const m = location.hash.match(/paper-(\d+)/); if (m && byId.has(+m[1])) select(+m[1]);
</script>
</body>
</html>
