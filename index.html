<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Master</title>
<meta name="description" content="研究手記收錄的 339 篇論文的關聯圖，可依研究群集、tag 與來源分支篩選。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Noto+Serif+TC:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>try{const f=localStorage.getItem('pm-gfs');if(f)document.documentElement.dataset.fs=f}catch(e){}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>html{--fs:1}html[data-fs="1"]{--fs:1.15}html[data-fs="2"]{--fs:1.3}

:root{
  --bg:#F6F4EE; --surface:#FFFFFF; --surface-2:#EEEBE3; --ink:#1D1C19; --ink-2:#57534B; --ink-3:#67635A;
  --line:#DCD7CB; --edge:#CFC9BC; --accent:#B4532A; --accent-soft:#F3E2D8;
  --shadow:0 1px 2px rgba(29,28,25,.06),0 12px 32px -16px rgba(29,28,25,.22);
  --f-display:"Newsreader","Noto Serif TC","Songti TC",Georgia,serif;
  --f-cjk-serif:"Noto Serif TC","Songti TC",Georgia,serif;
  --f-body:"IBM Plex Sans","Noto Sans TC","PingFang TC",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,0,0,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#161513; --surface:#1F1E1B; --surface-2:#2A2925; --ink:#EEEBE4; --ink-2:#B5B0A5; --ink-3:#8E897F;
    --line:#36342F; --edge:#46433D; --accent:#E58C66; --accent-soft:#3B2820;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -16px rgba(0,0,0,.7); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161513; --surface:#1F1E1B; --surface-2:#2A2925; --ink:#EEEBE4; --ink-2:#B5B0A5; --ink-3:#8E897F;
  --line:#36342F; --edge:#46433D; --accent:#E58C66; --accent-soft:#3B2820;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -16px rgba(0,0,0,.7); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;
  display:grid;grid-template-columns:320px minmax(0,1fr) 384px;grid-template-rows:64px minmax(0,1fr);height:100vh;overflow:hidden}
a{color:var(--accent);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header */
header{grid-column:1/-1;display:flex;align-items:center;gap:24px;padding:0 24px;border-bottom:1px solid var(--line);background:var(--bg)}
.brand{display:flex;align-items:baseline;gap:12px;text-decoration:none;color:var(--ink)}
.brand b{font-family:var(--f-display);font-weight:500;font-size:24px;letter-spacing:-.01em}
.brand span{font-family:var(--f-cjk-serif);font-size:13px;color:var(--ink-3)}
.stats{display:flex;gap:16px;font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.stats b{color:var(--ink);font-weight:500}
header nav{margin-left:auto;display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink);font:500 13px/1 var(--f-body);text-decoration:none;cursor:pointer;transition:background .16s var(--ease),border-color .16s var(--ease)}
.btn:hover{background:var(--surface-2);border-color:var(--edge)}
.btn svg{width:16px;height:16px;flex:none}
.btn.icon{width:36px;padding:0;justify-content:center}
.ftoggle{display:none!important}

/* rails */
aside{overflow:auto;background:var(--bg)}
#left{border-right:1px solid var(--line);padding:24px 20px 32px;display:flex;flex-direction:column;gap:24px}
#right{border-left:1px solid var(--line);padding:24px 24px 48px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 8px;font:600 11px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.sec-h button{all:unset;cursor:pointer;font:500 12px/1 var(--f-body);letter-spacing:0;text-transform:none;color:var(--accent)}
.sec-h button:hover{text-decoration:underline}
.sec-h button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;width:16px;height:16px;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:500 11px/1 var(--f-mono);color:var(--ink-3);border:1px solid var(--line);border-radius:5px;padding:3px 6px}
input[type=search],select{width:100%;height:42px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:15px var(--f-body)}
input[type=search]{padding-left:38px;padding-right:40px}
input[type=search]:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.seg{display:grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:10px;background:var(--surface-2)}
.seg button{all:unset;cursor:pointer;text-align:center;min-height:34px;line-height:1.25;padding:6px 4px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;border-radius:8px;font:500 13px var(--f-mono);color:var(--ink-2);transition:background .16s var(--ease),color .16s var(--ease)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.clist{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.clist button{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:12px 1fr auto;align-items:center;gap:10px;min-height:36px;padding:6px 10px;border-radius:8px;
  font:500 14px/1.3 var(--f-body);color:var(--ink);transition:background .16s var(--ease),opacity .16s var(--ease)}
.clist button:hover{background:var(--surface-2)}
.clist button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.clist .dot{width:10px;height:10px;border-radius:50%;transition:transform .16s var(--ease)}
.clist .n{font:12px var(--f-mono);color:var(--ink-3)}
.clist button[aria-pressed=false]{color:var(--ink-3);opacity:.6}
.clist button[aria-pressed=false] span:nth-child(2){text-decoration:line-through;text-decoration-color:var(--line)}
.clist button[aria-pressed=false] .dot{background:transparent!important;box-shadow:inset 0 0 0 1.5px var(--ink-3);transform:scale(.8)}
#results{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
#results li{border-bottom:1px solid var(--line)}
#results button{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:44px 1fr;gap:8px;padding:10px 4px;font-size:14px;line-height:1.4;transition:background .16s var(--ease)}
#results button:hover{background:var(--surface-2)}
#results button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
#results .no{font:12px/1.6 var(--f-mono);color:var(--ink-3)}
#results li.active button{background:var(--accent-soft)}
#results li.active .no{color:var(--accent)}
.more{font-size:13px;color:var(--ink-3);padding:12px 4px}

/* graph */
main{position:relative;overflow:hidden;background:var(--bg)}
svg#graph{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
svg#graph:active{cursor:grabbing}
.link{stroke:var(--edge);stroke-width:1;stroke-opacity:.7;transition:stroke-opacity .24s var(--ease)}
.node circle{stroke:var(--bg);stroke-width:1.5;cursor:pointer;transition:opacity .24s var(--ease)}
.node:hover circle{stroke:var(--ink);stroke-width:2}
.node text{font:500 calc(13px * var(--fs)) var(--f-body);fill:var(--ink);pointer-events:none;display:none;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.node.lbl text{display:block}
.node.sel circle{stroke:var(--ink);stroke-width:3}
.node.sel text{font-weight:700}
.dim .node circle{opacity:.28}
.dim .link{stroke-opacity:.12}
.dim .node.hl circle{opacity:1}
.dim .link.hl{stroke:var(--accent);stroke-opacity:.9;stroke-width:1.5}
.clabel{font:italic 500 calc(18px * var(--fs)) var(--f-display);fill:var(--ink);letter-spacing:.01em;pointer-events:none;paint-order:stroke;stroke:var(--bg);stroke-width:6px;stroke-linejoin:round;transition:opacity .24s var(--ease)}
.float{position:absolute;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.legend{left:20px;bottom:20px;padding:12px 16px;font-size:12px;line-height:1.6;color:var(--ink-2);max-width:min(340px,calc(100% - 104px))}
.legend b{font-weight:600;color:var(--ink)}
.zoomctl{right:20px;bottom:20px;display:flex;flex-direction:column;padding:4px}
.zoomctl button{all:unset;cursor:pointer;width:40px;height:40px;display:grid;place-items:center;border-radius:10px;color:var(--ink);transition:background .16s var(--ease)}
.zoomctl button:hover{background:var(--surface-2)}
.zoomctl button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.zoomctl svg{width:18px;height:18px}
.zoomctl hr{border:0;border-top:1px solid var(--line);margin:2px 6px}
.tip{position:absolute;pointer-events:none;max-width:280px;padding:8px 12px;border-radius:10px;background:var(--ink);color:var(--bg);font-size:13px;line-height:1.4;
  opacity:0;transform:translateY(4px);transition:opacity .16s var(--ease),transform .16s var(--ease);z-index:3}
.tip.show{opacity:1;transform:none}
.tip .no{display:block;font:11px var(--f-mono);opacity:.7;margin-bottom:2px}

/* detail card */
.card-no{display:flex;justify-content:space-between;align-items:center;font:12px var(--f-mono);color:var(--ink-3);padding-bottom:12px;border-bottom:1px solid var(--ink)}
.card-no b{font-weight:500;color:var(--ink);font-size:13px}
.pill{display:flex;align-items:center;gap:8px;margin:0 0 16px;font:500 12px var(--f-body);color:var(--ink-2)}
.pill i{width:10px;height:10px;border-radius:50%}
.swap{animation:swap .24s var(--ease)}@keyframes swap{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#detail h2{font-family:var(--f-display);font-weight:500;font-size:26px;line-height:1.22;letter-spacing:-.01em;margin:16px 0 8px;text-wrap:balance}
#detail .authors{color:var(--ink-2);font-size:14px;margin:0 0 16px}
#detail .summary{font-size:15px;line-height:1.65;margin:0 0 20px}
.open{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;background:var(--ink);color:var(--bg);text-decoration:none;font:600 14px var(--f-body);transition:opacity .16s var(--ease)}
.open:hover{opacity:.86}
:root[data-theme=dark] .open{background:var(--accent-soft);color:var(--ink);box-shadow:inset 0 0 0 1px var(--accent)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .open{background:var(--accent-soft);color:var(--ink);box-shadow:inset 0 0 0 1px var(--accent)}}
.open svg{width:14px;height:14px}
.field{margin-top:28px}
.field h3{margin:0 0 10px;font:600 11px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font:500 12px var(--f-body);padding:4px 10px;border-radius:6px;background:var(--surface-2);color:var(--ink-2)}
.src{font-size:13px;line-height:1.6;color:var(--ink-2)}
.src code{font:12px var(--f-mono);color:var(--ink)}
.rel{list-style:none;margin:0;padding:0;counter-reset:r}
.rel li{border-top:1px solid var(--line)}
.rel li:last-child{border-bottom:1px solid var(--line)}
.rel button,.rel a{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:44px 1fr;gap:8px;padding:10px 0;font-size:14px;line-height:1.4;color:var(--ink);transition:color .16s var(--ease)}
.rel button:hover,.rel a:hover{color:var(--accent)}
.rel button:focus-visible,.rel a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rel .no{font:12px/1.6 var(--f-mono);color:var(--ink-3)}
.empty h2{font-family:var(--f-display);font-weight:500;font-size:28px;line-height:1.2;margin:0 0 12px}
.empty p{color:var(--ink-2);margin:0 0 8px;font-size:14px;line-height:1.65}

@media (max-width:1180px){ body{grid-template-columns:280px minmax(0,1fr) 340px} .stats{display:none} }
@media (max-width:900px){
  body{display:flex;flex-direction:column;height:auto;overflow:auto}
  #left{order:1} main{order:2} #right{order:3}
  .srch-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
  .srch-row .sec-h{grid-column:1/-1}
  .ftoggle{display:inline-flex!important;height:42px}
  #left:not(.open)>div:not(.srch-row){display:none}
  #left{gap:16px}
  header{position:sticky;top:0;z-index:5;height:56px;padding:0 16px;gap:12px}
  .brand span{display:none}
  header{order:0}
  header nav .btn.csv{display:none}
  #left,#right{border:0;padding:20px 16px}
  #left{border-bottom:1px solid var(--line)}
  #results{max-height:320px;overflow:auto}
  main{height:64vh;border-bottom:1px solid var(--line)}
  .legend{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.001ms!important;animation-duration:.001ms!important}}
</style>
</head>
<body>
<header>
  <a class="brand" href="index.html"><b>Paper Master</b><span>研究手記 論文圖集</span></a>
  <div class="stats" id="stats"></div>
  <nav>
    <a class="btn txt" href="tutorials/index.html">教學與筆記</a>
    <a class="btn txt csv" href="papers.csv" download>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg>下載 CSV</a>
    <button class="btn" id="fs" type="button" title="圖中文字大小"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 18 9 6l5 12M5.6 14h6.8M15 18l3-7.5 3 7.5M15.8 16h4.4"/></svg><span>標準</span></button>
    <button class="btn icon" id="theme" type="button" aria-label="切換深色或淺色模式">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg></button>
  </nav>
</header>

<aside id="left" aria-label="搜尋與篩選">
  <div class="srch-row">
    <label class="sec-h" for="q">搜尋</label>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="q" placeholder="標題、作者或 tag" autocomplete="off">
      <kbd aria-hidden="true">/</kbd>
    </div>
    <button type="button" class="btn ftoggle" id="ftoggle" aria-expanded="false" aria-controls="left">篩選與清單</button>
  </div>
  <div>
    <div class="sec-h" id="br-h">來源分支</div>
    <div class="seg" id="branches" role="group" aria-labelledby="br-h"></div>
  </div>
  <div>
    <div class="sec-h"><span id="cl-h">研究群集</span><button type="button" id="cl-all">全部顯示</button></div>
    <ul class="clist" id="clusters" aria-labelledby="cl-h"></ul>
  </div>
  <div>
    <label class="sec-h" for="tag">Tag</label>
    <select id="tag"><option value="">全部 tag</option></select>
  </div>
  <div>
    <div class="sec-h"><span id="rcount">論文</span></div>
    <ul id="results"></ul>
  </div>
</aside>

<main>
  <svg id="graph" role="img" aria-label="論文關聯圖。節點為論文，顏色為研究群集，連線為主題相似。"></svg>
  <div class="tip" id="tip" role="status"></div>
  <div class="float legend"><b>閱讀方式</b>：節點大小表示被其他論文列為相關的次數，顏色表示研究群集，連線表示主題相似。滾輪縮放會拉開節點間距，放大後顯示標題。</div>
  <div class="float zoomctl" role="group" aria-label="縮放">
    <button type="button" id="zin" aria-label="放大"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <button type="button" id="zout" aria-label="縮小"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14"/></svg></button>
    <hr>
    <button type="button" id="zfit" aria-label="顯示全部"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
</main>

<aside id="right" aria-label="論文詳情" aria-live="polite"><div id="detail"></div></aside>

  el.innerHTML = `<span class="dot" style="background:${color(c)}" aria-hidden="true"></span><span>${esc(c)}</span><span class="n">${DATA.filter(d => d.cluster === c).length}</span>`;
  el.onclick = () => { state.clusters.has(c) ? state.clusters.delete(c) : state.clusters.add(c); el.setAttribute('aria-pressed', state.clusters.has(c)); update(); };
  li.appendChild(el); clBox.appendChild(li); return [c, el];
});
document.getElementById('cl-all').onclick = () => { clusters.forEach(c => state.clusters.add(c)); clBtns.forEach(([, el]) => el.setAttribute('aria-pressed', 'true')); update(); };
const tagSel = document.getElementById('tag');
const tagCount = {}; DATA.forEach(d => d.tags.forEach(t => tagCount[t] = (tagCount[t] || 0) + 1));
Object.entries(tagCount).sort((a, b) => b[1] - a[1]).forEach(([t, n]) => tagSel.add(new Option(`${t}（${n}）`, t)));
tagSel.onchange = () => { state.tag = tagSel.value; update(); };
const qEl = document.getElementById('q');
const ft = document.getElementById('ftoggle');
ft.onclick = () => { const o = document.getElementById('left').classList.toggle('open'); ft.setAttribute('aria-expanded', o); };
qEl.oninput = e => { state.q = e.target.value.trim().toLowerCase(); update(); };
addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== qEl) { e.preventDefault(); qEl.focus(); }
  if (e.key === 'Escape' && state.sel) deselect();
});

// graph
const svg = d3.select('#graph');
const g = svg.append('g');
// semantic zoom: the transform moves node positions apart; circles and labels keep their screen size
let T = d3.zoomIdentity, K0 = 1; // K0 = scale of the fitted overview
const zoom = d3.zoom().scaleExtent([.05, 20]).on('zoom', e => { T = e.transform; draw(); });
svg.call(zoom).on('dblclick.zoom', null);
const links = [];
const seen = new Set();
DATA.forEach(d => d.related.forEach(r => { const k = [Math.min(d.id, r), Math.max(d.id, r)].join('-'); if (!seen.has(k)) { seen.add(k); links.push({source:d.id, target:r}); } }));
const linkSel = g.append('g').selectAll('line').data(links).join('line').attr('class', 'link');
const nodeSel = g.append('g').selectAll('g').data(DATA, d => d.id).join('g').attr('class', 'node');
const radius = d => 4 + Math.sqrt(d.degree) * 2.6;
const clSel = g.append('g').selectAll('text').data(clusters).join('text').attr('class', 'clabel').attr('text-anchor', 'middle').text(c => c);
const tip = document.getElementById('tip');
nodeSel.append('circle').attr('r', radius).attr('fill', d => color(d.cluster))
  .on('click', (e, d) => state.sel === d.id ? deselect() : select(d.id, true))
  .on('mouseenter', (e, d) => { tip.innerHTML = `<span class="no">${no(d.id)}</span>${esc(d.title)}`; tip.classList.add('show'); })
  .on('mousemove', e => { const r = svg.node().getBoundingClientRect(); tip.style.left = (e.clientX - r.left + 14) + 'px'; tip.style.top = (e.clientY - r.top + 14) + 'px'; })
  .on('mouseleave', () => tip.classList.remove('show'));
// wrap long titles into up to 3 lines (word-based; CJK runs split per character)
const FS = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fs')) || 1;
let LINE = 16, CH = 7.4; const MAXC = 24;
function wrap(t){
  const words = t.match(/[　-鿿＀-￯]|[^\s　-鿿＀-￯]+/g) || [t];
  const lines = []; let cur = '';
  for (const w of words) {
    const sep = cur && /^[\x00-\x7f]/.test(w) && /[\x00-\x7f]$/.test(cur) ? ' ' : '';
    if ((cur + sep + w).length > MAXC && cur) { lines.push(cur); cur = w; } else cur += sep + w;
  }
  if (cur) lines.push(cur);
  if (lines.length > 3) { lines.length = 3; lines[2] = lines[2].replace(/.{0,2}$/, '…'); }
  return lines;
}
const textW = s => [...s].reduce((a, c) => a + (c.charCodeAt(0) > 0x2e80 ? CH * 1.8 : CH), 0);
const textSel = nodeSel.append('text').attr('text-anchor', 'middle');
function measure(){ // label metrics follow the text-size setting
  LINE = 16 * FS(); CH = 7.4 * FS();
  DATA.forEach(d => { d.lines = wrap(d.title); d.lw = Math.max(...d.lines.map(textW)); d.lh = d.lines.length * LINE; });
  textSel.selectAll('tspan').data(d => d.lines).join('tspan').attr('x', 0).attr('dy', (l, i) => i ? LINE : 0).text(l => l);
}
measure();
addEventListener('pm-fs', () => { measure(); draw(); });
nodeSel.call(d3.drag()
  .subject((e, d) => ({x: T.applyX(d.x), y: T.applyY(d.y)}))
  .on('start', (e, d) => { if (!e.active) sim.alphaTarget(.2).restart(); d.fx = d.x; d.fy = d.y; })
  .on('drag', (e, d) => { d.fx = T.invertX(e.x); d.fy = T.invertY(e.y); })
  .on('end', (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = d.fy = null; }));

const center = c => { const a = clusters.indexOf(c) / clusters.length * Math.PI * 2; return [Math.cos(a) * 420, Math.sin(a) * 420]; };
const sim = d3.forceSimulation(DATA)
  .force('link', d3.forceLink(links).id(d => d.id).distance(50).strength(.25))
  .force('charge', d3.forceManyBody().strength(-38))
  .force('x', d3.forceX(d => center(d.cluster)[0]).strength(.07))
  .force('y', d3.forceY(d => center(d.cluster)[1]).strength(.07))
  .force('collide', d3.forceCollide(d => radius(d) + 2))
  .stop();
sim.tick(400); // settle layout up front so the first paint and the fit are stable
function centroids(){
  return new Map(clusters.map(c => {
    const ns = DATA.filter(d => d.cluster === c), xs = ns.map(d => d.x).sort(d3.ascending), ys = ns.map(d => d.y).sort(d3.ascending);
    return [c, {x: d3.median(xs), y: d3.median(ys), x0: d3.quantile(xs, .1), x1: d3.quantile(xs, .9), y0: d3.quantile(ys, .1), y1: d3.quantile(ys, .9)}];
  }));
}
let CEN = centroids();
function draw(){
  linkSel.attr('x1', d => T.applyX(d.source.x)).attr('y1', d => T.applyY(d.source.y)).attr('x2', d => T.applyX(d.target.x)).attr('y2', d => T.applyY(d.target.y));
  nodeSel.attr('transform', d => `translate(${T.applyX(d.x)},${T.applyY(d.y)})`);
  const z = T.k / K0;
  placeLabels();
}
// greedy label placement: highest-priority labels first, each tries above then below its node,
// and is skipped if it would overlap a label already placed — so labels never collide
// ponytail: O(n^2) box checks over visible labels; fine for a few hundred nodes, use a grid index beyond that
function placeLabels(){
  const z = T.k / K0, dim = g.classed('dim');
  const want = d => nodeVisible.has(d.id) && (d.id === state.sel || (dim ? hlSet.has(d.id) : (z >= 5 || (z >= 2.5 && d.degree >= 6))));
  const cand = DATA.filter(want).sort((a, b) => (b.id === state.sel) - (a.id === state.sel) || b.degree - a.degree);
  const placed = [], shown = new Map();
  const hit = b => placed.some(p => b[0] < p[2] && b[2] > p[0] && b[1] < p[3] && b[3] > p[1]);
  // cluster names first (overview only), then node circles as obstacles, then paper titles
  const showCl = z < 2.2 && !dim;
  const clPos = new Map();
  const {width: W, height: H} = svg.node().getBoundingClientRect();
  const obstacles = DATA.filter(d => nodeVisible.has(d.id) && (!dim || hlSet.has(d.id))).map(d => {
    const x = T.applyX(d.x), y = T.applyY(d.y), r = radius(d) + 2; return [x - r, y - r, x + r, y + r, d.id];
  });
  const hitAny = b => obstacles.some(p => b[0] < p[2] && b[2] > p[0] && b[1] < p[3] && b[3] > p[1]);
  // each cluster name searches nearby spots (above the cluster core first) for one free of nodes and other names
  if (showCl) clusters.filter(c => state.clusters.has(c)).forEach(c => {
    const k = CEN.get(c), w = c.length * 8.4 * FS();
    const X = T.applyX(k.x), X0 = T.applyX(k.x0), X1 = T.applyX(k.x1), Y = T.applyY(k.y), Y0 = T.applyY(k.y0), Y1 = T.applyY(k.y1);
    const spots = [[X, Y0 - 18], [X, Y1 + 30], [X, Y0 - 38], [X, Y1 + 50], [X, Y]];
    // pass 1: a spot clear of nodes and names; pass 2: clear of names only (halo keeps it legible over nodes)
    for (const [sx, sy, strict] of [...spots.map(q => [...q, 1]), ...spots.map(q => [...q, 0])]) {
      const x = Math.min(Math.max(sx, w/2 + 12), W - w/2 - 12), y = Math.min(Math.max(sy, 28), H - 12);
      const b = [x - w/2 - 4, y - 16, x + w/2 + 4, y + 6];
      if (!hit(b) && (!strict || !hitAny(b))) { placed.push(b); clPos.set(c, [x, y]); break; }
    }
  });
  clSel.style('opacity', c => clPos.has(c) ? 1 : 0).attr('x', c => clPos.has(c) ? clPos.get(c)[0] : -999).attr('y', c => clPos.has(c) ? clPos.get(c)[1] : -999);
  const hitNode = (b, id) => obstacles.some(p => p[4] !== id && b[0] < p[2] && b[2] > p[0] && b[1] < p[3] && b[3] > p[1]);
  for (const d of cand) {
    const x = T.applyX(d.x), y = T.applyY(d.y), r = radius(d), pad = 3;
    const above = [x - d.lw/2 - pad, y - r - 4 - d.lh - pad, x + d.lw/2 + pad, y - r - 4 + pad];
    const below = [x - d.lw/2 - pad, y + r + 4 - pad, x + d.lw/2 + pad, y + r + 4 + d.lh + pad];
    const ok = q => !hit(q) && !hitNode(q, d.id);
    const b = ok(above) ? above : ok(below) ? below : (d.id === state.sel ? above : null);
    if (!b) continue;
    placed.push(b);
    shown.set(d.id, b === above ? -r - 4 - d.lh + LINE - 3 : r + 4 + LINE - 3);
  }
  nodeSel.classed('lbl', d => shown.has(d.id));
  textSel.attr('transform', d => shown.has(d.id) ? `translate(0,${shown.get(d.id)})` : null);
}
sim.on('tick', () => { CEN = centroids(); draw(); });
const go = sel => reduce ? sel : sel.transition().duration(400).ease(d3.easeCubicOut);
function fit(animate){
  const {width, height} = svg.node().getBoundingClientRect();
  const xs = DATA.map(d => d.x), ys = DATA.map(d => d.y);
  const [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
  const k = K0 = Math.min(width / (x1 - x0 + 120), height / (y1 - y0 + 120), 2);
  (animate ? go(svg) : svg).call(zoom.transform, d3.zoomIdentity.translate(width/2 - k*(x0+x1)/2, height/2 - k*(y0+y1)/2).scale(k));
}
fit(false);
document.getElementById('zin').onclick = () => go(svg).call(zoom.scaleBy, 1.6);
document.getElementById('zout').onclick = () => go(svg).call(zoom.scaleBy, 1 / 1.6);
document.getElementById('zfit').onclick = () => fit(true);
function focusNode(d){
  const {width, height} = svg.node().getBoundingClientRect();
  const ns = [d, ...d.related.map(r => byId.get(r))];
  const [x0, x1] = d3.extent(ns, n => n.x), [y0, y1] = d3.extent(ns, n => n.y);
  // frame the neighborhood, leaving room on each side for title labels
  const px = Math.min(170, width * .2), py = Math.min(130, height * .16);
  const k = Math.min((width - 2*px) / Math.max(x1 - x0, 1), (height - 2*py) / Math.max(y1 - y0, 1), K0 * 8);
  go(svg).call(zoom.transform, d3.zoomIdentity.translate(width/2 - k*(x0+x1)/2, height/2 - k*(y0+y1)/2).scale(Math.max(k, K0 * 1.5)));
}

function visible(d){
  if (!state.clusters.has(d.cluster)) return false;
  if (!d.branch.some(b => state.branches.has(b))) return false;
  if (state.tag && !d.tags.includes(state.tag)) return false;
  if (state.q && !(d.title + ' ' + d.authors.join(' ') + ' ' + d.tags.join(' ')).toLowerCase().includes(state.q)) return false;
  return true;
}
document.getElementById('stats').innerHTML = `<span><b>${DATA.length}</b> 篇論文</span><span><b>${clusters.length}</b> 個群集</span><span><b>${links.length}</b> 條關聯</span>`;
function update(){
  const vis = new Set(DATA.filter(visible).map(d => d.id));
  nodeSel.style('display', d => vis.has(d.id) ? null : 'none');
  linkSel.style('display', d => vis.has(d.source.id) && vis.has(d.target.id) ? null : 'none');
  const filtering = state.q || state.tag;
  const hl = new Set(filtering ? vis : []);
  if (state.sel) { hl.add(state.sel); byId.get(state.sel).related.forEach(r => hl.add(r)); }
  g.classed('dim', hl.size > 0);
  nodeVisible = vis; hlSet = hl;
  nodeSel.classed('hl', d => hl.has(d.id)).classed('sel', d => d.id === state.sel);
  linkSel.classed('hl', d => state.sel && (d.source.id === state.sel || d.target.id === state.sel));
  draw();
  const list = DATA.filter(d => vis.has(d.id));
  document.getElementById('rcount').textContent = `論文 ${list.length} 篇`;
  const ul = document.getElementById('results'); ul.innerHTML = '';
  list.slice(0, 150).forEach(d => {
    const li = document.createElement('li'); if (d.id === state.sel) li.className = 'active';
    li.innerHTML = `<button type="button"><span class="no">${String(d.id).padStart(3, '0')}</span><span>${esc(d.title)}</span></button>`;
    li.firstChild.onclick = () => select(d.id, true); ul.appendChild(li);
  });
  if (list.length > 150) ul.insertAdjacentHTML('beforeend', `<li class="more">另有 ${list.length - 150} 篇，請用搜尋或篩選縮小範圍。</li>`);
  if (!list.length) ul.innerHTML = '<li class="more">沒有符合條件的論文。調整搜尋字詞或篩選條件。</li>';
}
const relItem = d => `<li><button type="button" data-id="${d.id}"><span class="no">${String(d.id).padStart(3, '0')}</span><span>${esc(d.title)}</span></button></li>`;
function renderEmpty(){
  const top = [...DATA].sort((a, b) => b.degree - a.degree).slice(0, 6);
  document.getElementById('detail').innerHTML = `<div class="empty">
    <h2>選一篇論文</h2>
    <p>點選圖上的節點或左側清單中的標題，這裡會顯示論文資訊、來源與最相關的 6 篇論文。</p>
    <p>按 <span class="mono">/</span> 搜尋。再點一次已選取的節點或按 <span class="mono">Esc</span>，取消高亮。</p>
    <div class="field"><h3>被列為相關次數最多</h3><ul class="rel">${top.map(relItem).join('')}</ul></div></div>`;
  bindRel();
}
// clicking the selected node again (or Esc) clears the highlight; the current view stays where it is
function deselect(){
  state.sel = null; history.replaceState(null, '', location.pathname); update(); renderEmpty();
}
function bindRel(){ document.querySelectorAll('#detail button[data-id]').forEach(b => b.onclick = () => select(+b.dataset.id, true)); }
function select(id, focus){
  state.sel = id; update();
  const d = byId.get(id);
  if (focus) focusNode(d);
  history.replaceState(null, '', '#paper-' + id);
  const tuts = TUTORIALS.filter(t => t.papers.includes(id));
  document.getElementById('detail').innerHTML = `
    <div class="card-no"><b>${no(d.id)}</b><span>${d.year || '年份未知'}</span></div>
    <h2>${esc(d.title)}</h2>
    <p class="authors">${d.authors.length ? esc(d.authors.slice(0, 5).join(', ')) + (d.authors.length > 5 ? ' et al.' : '') : '作者未列於來源清單'}</p>
    <p class="pill"><i style="background:${color(d.cluster)}" aria-hidden="true"></i>${esc(d.cluster)}</p>
    ${d.summary ? `<p class="summary">${esc(d.summary)}</p>` : ''}
    <a class="open" href="${esc(d.url)}" target="_blank" rel="noopener">開啟論文<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg><span class="sr-only">（另開分頁）</span></a>
    <div class="field"><h3>Tags</h3><div class="tags">${d.tags.map(t => `<span>${esc(t)}</span>`).join('')}</div></div>
    <div class="field"><h3>來源</h3><div class="src">${d.sources.map(s => `<code>${esc(s)}</code>`).join('<br>')}<br>原分類：${d.cats.map(esc).join('、')}</div></div>
    ${tuts.length ? `<div class="field"><h3>教學與筆記</h3><ul class="rel">${tuts.map((t, i) => `<li><a href="tutorials/${t.file}"><span class="no">${t.kind === 'hub' ? '總覽' : t.kind ? '筆記' : '教學'}</span><span>${esc(t.title)}</span></a></li>`).join('')}</ul></div>` : ''}
    <div class="field"><h3>最相關的論文</h3><ul class="rel">${d.related.map(r => relItem(byId.get(r))).join('')}</ul></div>`;
  bindRel();
  const dt = document.getElementById('detail'); dt.classList.remove('swap'); void dt.offsetWidth; dt.classList.add('swap');
}
update();
const m = location.hash.match(/paper-(\d+)/);
if (m && byId.has(+m[1])) select(+m[1], true); else renderEmpty();
</script>
<script>(()=>{const L=['標準','大','特大'],b=document.getElementById('fs'),r=document.documentElement;
const show=()=>{const i=+(r.dataset.fs||0);b.querySelector('span').textContent=L[i];b.setAttribute('aria-label','圖中文字大小：'+L[i]+'，點選切換');};
b.onclick=()=>{const i=(+(r.dataset.fs||0)+1)%3;r.dataset.fs=i;try{localStorage.setItem('pm-gfs',i)}catch(e){};show();dispatchEvent(new Event('pm-fs'));};show();})();</script>
